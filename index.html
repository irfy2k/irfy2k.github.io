<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ahmed Zuhair Portfolio</title>
<meta name="description" content="A portfolio where every section is a stack of tetrominoes. Clear the lines to move to the next page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBF1; --well:#F4F6FA; --grid:rgba(26,28,44,.07); --ink:#1A1C2C; --muted:#565B72; --wall:#1A1C2C;
  --I:#29B9D6; --O:#F2C230; --T:#8A4CC4; --S:#3AAE5B; --Z:#E4474C; --J:#2D58DB; --L:#EF8229;
  --on-light:#1A1C2C; --on-dark:#FFFFFF; --on-wall:#F4F6FA;
  --cell:64px; --cols:10; --rows:4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#12152A; --well:#191D36; --grid:rgba(236,238,247,.06); --ink:#ECEEF7; --muted:#9CA2C0; --wall:#3A4170; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#12152A; --well:#191D36; --grid:rgba(236,238,247,.06); --ink:#ECEEF7; --muted:#9CA2C0; --wall:#3A4170; color-scheme:dark; }

[data-type="I"]{--pc:var(--I);--pt:var(--on-light)}
[data-type="O"]{--pc:var(--O);--pt:var(--on-light)}
[data-type="T"]{--pc:var(--T);--pt:var(--on-dark)}
[data-type="S"]{--pc:var(--S);--pt:var(--on-light)}
[data-type="Z"]{--pc:var(--Z);--pt:var(--on-light)}
[data-type="J"]{--pc:var(--J);--pt:var(--on-dark)}
[data-type="L"]{--pc:var(--L);--pt:var(--on-light)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.wrap{width:calc(var(--cols) * var(--cell));margin-inline:auto;min-height:100dvh;display:flex;flex-direction:column}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:16px 0 8px}
.brand{font:600 20px/1 "Pixelify Sans",monospace;margin:0}
.hud nav{flex:1 1 auto;min-width:0}
.hud ul{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.hud nav button{background:none;border:0;padding:6px 10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.hud nav button:hover{color:var(--ink)}
.hud nav button[aria-current]{background:var(--ink);color:var(--bg)}
.stats{display:flex;align-items:stretch;gap:8px;margin-left:auto}
.stat,.next{display:flex;flex-direction:column;justify-content:center;padding:4px 12px;border:2px solid var(--wall);background:var(--well);min-width:64px}
.stat span,.next span{font-size:11px;color:var(--muted);line-height:1.2}
.stat b,.next b{font:600 18px/1.1 "Pixelify Sans",monospace}
.next{cursor:pointer;text-align:left;flex-direction:row;align-items:center;gap:10px}
.next:hover{border-color:var(--I)}
.next .mini{width:34px;height:9px;flex:none;background:repeating-linear-gradient(90deg,var(--I) 0 7.5px,transparent 7.5px 8.5px)}

/* Intro */
/* Spare height goes above the title, so the intro text sits right on top of the board. */
.intro{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(16px,4vh,48px) 0 28px;position:relative;z-index:1}
h1{font:700 clamp(40px,calc(var(--cell) * .78),104px)/.95 "Pixelify Sans",monospace;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
.lede{max-width:54ch;color:var(--muted);margin:0;font-size:clamp(15px,calc(var(--cell) * .15),18px)}

/* Board */
.board{position:relative;z-index:2;height:calc(var(--rows) * var(--cell));margin-bottom:22px;
  background-color:var(--well);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);
  box-shadow:-6px 0 0 var(--wall),6px 0 0 var(--wall),0 6px 0 var(--wall),-6px 6px 0 var(--wall),6px 6px 0 var(--wall)}

/* The gap shows a ghost I piece: Tetris's landing preview, one outlined cell per row. */
.slot{position:absolute;left:calc(var(--c) * var(--cell));top:0;width:var(--cell);height:100%;
  border:0;cursor:pointer;display:grid;place-items:center;color:var(--muted);
  background-color:color-mix(in srgb,var(--I) 8%,transparent);
  background-image:linear-gradient(to bottom,transparent calc(var(--cell) - 2px),color-mix(in srgb,var(--I) 40%,transparent) 0);
  background-size:100% var(--cell);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--I) 55%,transparent)}
.slot span{writing-mode:vertical-rl;font:500 clamp(12px,calc(var(--cell) * .15),17px)/1 "Pixelify Sans",monospace;white-space:nowrap}
.slot:hover{background-color:color-mix(in srgb,var(--I) 22%,transparent);color:var(--ink)}
.slot:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
/* Idle: after 8s without input the ghost pulses to point at the way forward. */
.board.idle .slot{animation:ghost-pulse 1.8s ease-in-out infinite}
@keyframes ghost-pulse{50%{background-color:color-mix(in srgb,var(--I) 28%,transparent);color:var(--ink)}}
@media (prefers-reduced-motion:reduce){.board.idle .slot{animation:none}}

.piece{position:absolute;left:calc(var(--c) * var(--cell));top:calc(var(--r) * var(--cell));
  width:calc(var(--w) * var(--cell));height:calc(var(--h) * var(--cell));
  pointer-events:none;background:none;border:0;padding:0;z-index:1;translate:0 0;transition:translate .12s,filter .12s}
.cell{position:absolute;left:calc(var(--x) * var(--cell));top:calc(var(--y) * var(--cell));width:var(--cell);height:var(--cell);
  background:var(--pc);pointer-events:auto;--b:calc(var(--cell) * .07);
  /* --et/--el/--eb/--er are 1 where the cell sits on the piece's outer edge: dark rim, then bevel. */
  box-shadow:
    inset 0 calc(var(--et) * 2px) 0 rgba(0,0,0,.5), inset calc(var(--el) * 2px) 0 0 rgba(0,0,0,.5),
    inset 0 calc(var(--eb) * -2px) 0 rgba(0,0,0,.5), inset calc(var(--er) * -2px) 0 0 rgba(0,0,0,.5),
    inset 0 calc(var(--et) * var(--b)) 0 rgba(255,255,255,.4), inset calc(var(--el) * var(--b)) 0 0 rgba(255,255,255,.4),
    inset 0 calc(var(--eb) * var(--b) * -1) 0 rgba(0,0,0,.22), inset calc(var(--er) * var(--b) * -1) 0 0 rgba(0,0,0,.22),
    inset 0 0 0 .5px rgba(0,0,0,.12)}
button.piece .cell{cursor:pointer}
button.piece:hover{translate:0 -3px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
button.piece:focus-visible{outline:none;filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink))}

.label{position:absolute;left:calc(var(--x) * var(--cell));top:calc(var(--y) * var(--cell));
  width:calc(var(--lw) * var(--cell));height:calc(var(--lh) * var(--cell));padding:calc(var(--cell) * .16);
  display:flex;flex-direction:column;gap:4px;color:var(--pt);text-align:left;overflow:hidden;pointer-events:none}
.label b{font:600 max(13px,calc(var(--cell) * .19))/1.25 Rubik,sans-serif;flex:none;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--tl,1);overflow:hidden}
.label small{font-size:max(11.5px,calc(var(--cell) * .13));line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp,2);overflow:hidden}

/* Project screenshot: a 1-bit dither mask painted in a dark shade of the piece colour, continuous across cells. */
.piece[data-shot] .cell::before{content:"";position:absolute;inset:2px;background:color-mix(in srgb,var(--pc) 32%,#10121F);
  -webkit-mask:var(--img) no-repeat;mask:var(--img) no-repeat;
  -webkit-mask-size:calc(var(--iw) * var(--cell)) calc(var(--ih) * var(--cell));mask-size:calc(var(--iw) * var(--cell)) calc(var(--ih) * var(--cell));
  -webkit-mask-position:calc((var(--ix) - var(--x)) * var(--cell) - 2px) calc((var(--iy) - var(--y)) * var(--cell) - 2px);
  mask-position:calc((var(--ix) - var(--x)) * var(--cell) - 2px) calc((var(--iy) - var(--y)) * var(--cell) - 2px)}
.piece[data-shot] .label{justify-content:flex-end;gap:0;padding:calc(var(--cell) * .1)}
/* Over art, text sits on solid strips of the piece colour. */
/* Vertical spacing is border, not padding: overflow clips inside the border, so a clamped line never peeks out. */
.piece[data-shot] .label > *{align-self:flex-start;max-width:100%;background:var(--pc);padding:0 7px;border-block:2px solid var(--pc)}
.piece[data-shot] .label b{border-top-width:4px}
.piece[data-shot] .label > :last-child{border-bottom-width:5px}
.piece[data-shot] .label .meter{border-block-width:3px}
/* Filler pieces carry a stat: a big number and a short label. */
.stat-fill{justify-content:center;gap:2px}
.stat-fill b{display:block;font:700 calc(var(--fs) * var(--cell))/1 "Pixelify Sans",monospace;white-space:nowrap}
.stat-fill small{font-size:max(11px,calc(var(--cell) * .12));line-height:1.25}
.stat-fill.vert{writing-mode:vertical-rl;justify-content:flex-start;align-items:center}
.meter{display:flex;gap:2px}
.meter i{width:calc(var(--cell) * .085);height:calc(var(--cell) * .085);min-width:5px;min-height:5px;background:currentColor;opacity:.25}
.meter i.on{opacity:1}

.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;
  font:700 clamp(36px,calc(var(--cell) * .9),120px)/1 "Pixelify Sans",monospace;color:var(--ink);text-shadow:4px 4px 0 var(--I)}

/* Pause menu: opening a block pauses the game and shows an item-inspect screen. */
.pause{border:2px solid var(--wall);padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;
  background:var(--well);color:var(--ink);box-shadow:8px 8px 0 var(--wall)}
.pause::backdrop{background:rgba(18,21,42,.6)}
.p-bar{display:flex;justify-content:space-between;gap:12px;padding:8px 18px;background:var(--wall);color:var(--on-wall);font:600 16px/1.3 "Pixelify Sans",monospace}
.p-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:22px 22px 10px}
.p-art{position:relative;aspect-ratio:1;background:var(--pc);color:var(--pt);display:grid;place-items:center;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),inset 8px 8px 0 rgba(255,255,255,.35),inset -8px -8px 0 rgba(0,0,0,.2)}
.p-art .shot{position:absolute;inset:10px;background:color-mix(in srgb,var(--pc) 32%,#10121F);
  -webkit-mask:var(--img) center/cover no-repeat;mask:var(--img) center/cover no-repeat}
.p-info h2{font:700 34px/1.05 "Pixelify Sans",monospace;margin:0 0 6px;text-wrap:balance}
.p-sub{margin:0 0 14px;font-weight:500;color:var(--muted)}
#d-body{margin:0 0 16px;max-width:60ch}
.p-menu{list-style:none;margin:0;padding:10px 22px 18px;display:grid;gap:2px;border-top:2px solid var(--grid)}
.p-menu a,.p-menu button{display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px;border:0;background:none;
  font:600 18px/1.2 "Pixelify Sans",monospace;color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
.p-menu a::before,.p-menu button::before{content:"";flex:none;border-block:6px solid transparent;border-left:9px solid currentColor;opacity:0}
/* One cursor only: hovering moves focus (see script), so :focus alone marks the selected row. */
.p-menu :is(a,button):focus{outline:none;background:color-mix(in srgb,var(--pc) 22%,transparent)}
.p-menu :is(a,button):focus::before{opacity:1;animation:blink 1s steps(1) infinite}
/* Art shows whole at its own aspect ratio, beside the text so the menu fits without scrolling. */
.pause .p-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.pause .p-art{aspect-ratio:var(--a);height:auto;width:100%}
.pause .p-art .shot{-webkit-mask-size:contain;mask-size:contain}
@media (max-width:560px){
  .pause .p-grid{grid-template-columns:minmax(0,1fr)}
  .pause .p-art{width:min(100%,calc(22dvh * var(--a)))}
}
.p-menu :is(a,button):focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.p-menu :is(a,button)::before{animation:none!important}}
@media (max-width:560px){.p-grid{gap:14px;padding:16px 16px 8px}.p-info h2{font-size:26px}.p-sub{margin-bottom:8px}.p-menu{padding:8px 16px 14px}}
.d-meter:empty,.tags:empty{display:none}
.d-meter{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 16px/1 "Pixelify Sans",monospace}
.d-meter .meter i{width:16px;height:16px;opacity:1;background:var(--grid)}
.d-meter .meter i.on{background:var(--pc);box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0 0 20px}
.tags li{background:var(--pc);color:var(--pt);padding:5px 10px;font-size:13px;font-weight:500;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.2)}

/* One-time hint: styled like a HUD panel, with a tiny I piece dropping into its well. */
.tip{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:10;
  display:flex;align-items:center;gap:14px;padding:12px 14px;width:max-content;max-width:calc(100vw - 32px);
  background:var(--well);color:var(--ink);border:2px solid var(--wall);box-shadow:6px 6px 0 var(--wall)}
.tip p{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.35;min-width:0}
.tip b{font:600 17px/1.2 "Pixelify Sans",monospace}
.tip p span{color:var(--muted)}
.tip button{flex:none;border:2px solid var(--wall);background:var(--ink);color:var(--well);padding:7px 12px;font-weight:500;cursor:pointer}
.tip-art{flex:none;width:12px;height:44px;outline:2px dashed var(--muted);outline-offset:2px;overflow:hidden}
.tip-piece{display:flex;flex-direction:column;height:100%;animation:tip-drop 2.4s cubic-bezier(.55,0,1,.6) infinite}
.tip-piece i{flex:1;background:var(--I);box-shadow:inset 2px 2px 0 rgba(255,255,255,.4),inset -2px -2px 0 rgba(0,0,0,.2)}
@keyframes tip-drop{0%{transform:translateY(-100%)}30%,70%{transform:none;opacity:1}71%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.tip-piece{animation:none}}

@media (max-width:719px){
  /* Phone HUD: name and stats share one row, the page menu takes one scrollable row. */
  .hud{gap:10px 8px;padding-top:12px}
  .brand{font-size:16px}
  .stats{gap:6px}
  .stat,.next{min-width:0;padding:2px 8px}
  .stat b,.next b{font-size:15px}
  .next .mini{display:none}
  .hud nav{order:3;flex-basis:100%}
  .hud ul{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hud ul::-webkit-scrollbar{display:none}
  .hud ul{gap:2px}
  .hud nav button{padding:6px 5px;font-size:13px}
}
</style></head><body>
<div class="wrap">
  <header class="hud">
    <p class="brand">Ahmed Zuhair</p>
    <nav aria-label="Pages"><ul id="nav"></ul></nav>
    <div class="stats">
      <div class="stat"><span>Level</span><b id="level">1</b></div>
      <div class="stat"><span>Lines</span><b id="lines">000</b></div>
      <button class="next" id="next" type="button"><i class="mini" aria-hidden="true"></i><span>Next<br><b id="next-name">Work</b></span></button>
    </div>
  </header>
  <section class="intro" aria-live="polite">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </section>
  <main class="board" id="board" aria-label="Content blocks"></main>
</div>

<dialog id="detail" class="pause" aria-labelledby="d-title">
  <div class="p-bar"><span>Paused</span><span id="d-cat"></span></div>
  <div class="p-grid">
    <div class="p-art" id="d-art" aria-hidden="true"></div>
    <div class="p-info">
      <h2 id="d-title"></h2>
      <p class="p-sub" id="d-sub"></p>
      <p id="d-body"></p>
      <div class="d-meter" id="d-meter"></div>
      <ul class="tags" id="d-tags" aria-label="Tools"></ul>
    </div>
  </div>
  <form method="dialog"><ul class="p-menu" id="d-menu" aria-label="Actions"></ul></form>
</dialog>

<div class="tip" id="tip" role="status" hidden>
  <span class="tip-art" aria-hidden="true"><span class="tip-piece"><i></i><i></i><i></i><i></i></span></span>
  <p><b id="tip-title">Scroll to change page</b><span id="tip-text">Scroll down for the next page, up for the previous one.</span></p>
  <button type="button" id="tip-ok">Got it</button>
</div>

<script>
// Content. Max 5 items per page (each becomes a block).
// extras: stats shown on the filler pieces left over after the items.
// Item fields: t title, s subtitle, b body, icon (SPRITES key), tags, links [{label, href}], meter (0-100) + level.

  { name:'About', extras:[{n:'12+', l:'projects since 2023'},{n:'3.3', l:'CGPA'},{n:'3±1', l:'coffees a day'},{n:'2027', l:'graduating'},{n:'UTC+5', l:'Lahore time'}], title:'Ahmed Zuhair', lede:'Design engineer in Lahore. I build interactive systems where computer vision, real-time graphics and unconventional UI meet. Click a block to open it. Scroll down, or click the gap, to drop the I piece and move on.', items:[
    {t:'Builder', s:'Graphics, vision, game systems', icon:'cube', b:'Final-year CS student at FAST-NUCES Lahore, building where real-time graphics, computer vision and game systems meet. My work tends to live where the digital pretends to be physical: horde-defense games, voice agents that negotiate on your behalf, and web experiences that treat the browser like a stage for spatial interfaces.', tags:['Three.js','WebGL','Unity','Roblox','OpenCV','C++']},
    {t:'FAST-NUCES', s:'BSc CS, class of 2027', icon:'cap', b:'BSc Computer Science, 2023 to 2027 (expected), CGPA 3.3. Dean\'s List in my first semester. My final-year project benchmarks feed-forward 3D Gaussian Splatting.', tags:['OOP','DSA','HCI','Automata','Android']},
    {t:'Available', s:'Part-time, remote first', icon:'check', b:'Open to part-time and freelance work alongside my degree. Remote first; on-site works if it\'s in Lahore. Two weeks\' notice.', links:[{label:'Email me', href:'mailto:irfy2k1@outlook.com'}]},
    {t:'Fuel', s:'3 ± 1 coffees a day', icon:'coffee', b:'Three coffees a day, give or take one. The rest of the time I\'m reverse-engineering whichever portfolio I was most recently jealous of.'},
    {t:'Philosophy', s:'Interfaces as intent', icon:'quote', b:'"The best interfaces don\'t ask the user to think about the interface. They feel like an extension of intent: direct, physical, almost rude in how immediate they are."'},
  ]},
  { name:'Graphics', extras:[{n:'130', l:'spell cards'},{n:'GLSL', l:'custom shaders'},{n:'03', l:'splat models tested'},{n:'02', l:'live 3D sites'},{n:'C#', l:'Unity combat'}], title:'Graphics & games', lede:'Games, engines and 3D on the web. Five picks from 12+ projects since 2023.', items:[
    {t:'Walls Were Built to Fall', shot:'walls', s:'Co-op horde defense, Roblox', icon:'sword', b:'A co-op horde-defense roguelite FPS on Roblox, a fan-made homage built from scratch. Hold a castle wall against a demon horde: build towers and traps, draft from 130 spell cards with evolutions, mutations and combos, and carry progress between runs. Every model is built procedurally from Roblox primitives.', tags:['Roblox','Luau','Roguelite','Multiplayer']},
    {t:'Riposte', shot:'riposte', s:'2D parry combat, Unity', icon:'sword', b:'A fast 2D parry-combat game built from scratch in Unity. Custom hitbox detection, frame-perfect deflect timing and a souls-inspired start menu. Land a parry and goblins stun with a blue flash; their numbers grow the longer you survive.', tags:['Unity','C#','Combat AI','Game design'], links:[{label:'View code', href:GH + '/2d-Game'}]},
    {t:'Voxl v1', s:'3D web portfolio, Three.js', shot:'voxl', icon:'cube', b:'An interactive 3D portfolio with custom GLSL shaders, runtime mesh deformation and scroll-driven camera choreography. Includes a voxel sandbox that extrudes pixel drawings into Three.js geometry.', tags:['Three.js','GLSL','JavaScript'], links:[{label:'Open live site', href:'https://voxl-portfolio.vercel.app'},{label:'View code', href:GH + '/Voxl-Portfolio'}]},
    {t:'FabricOS', shot:'fabric', s:'3D fabric customiser', icon:'shirt', b:'A browser-based 3D customiser for designing and previewing fabric products in real time.', tags:['JavaScript','3D','Web'], links:[{label:'Open live site', href:'https://customizer-three.vercel.app'},{label:'View code', href:GH + '/Customizer'}]},
    {t:'Gaussian Splats', shot:'splats', s:'Final-year project, 3D vision', icon:'splat', b:'My final-year project: a benchmark and systems study of feed-forward 3D Gaussian Splatting. One pipeline runs MVSplat, NoPoSplat and AnySplat on the same data and GPUs, measures quality and cost together, then tests pruning, compression and keyframe selection. Includes a web viewer and an Android app that captures frames for a GPU server. In progress.', tags:['3D Gaussian Splatting','Computer vision','Android','Benchmarking']},
  ]},
  { name:'Apps', extras:[{n:'Voice', l:'AI agents'},{n:'1 mo', l:'store, end to end'},{n:'ffmpeg', l:'video renders'},{n:'Expo', l:'React Native'},{n:'Next.js', l:'AI dashboard'}], title:'AI, apps & client work', lede:'Voice agents, automation, mobile apps and a paid storefront.', items:[
    {t:'The Negotiator', shot:'negotiator', s:'AI voice agent, HackNation', icon:'phone', b:'Built at HackNation, an international AI hackathon. Voice agents call property dealers in Pakistan, pull itemised rent quotes out of live conversation, compare the bids and hand back a ranked report. Every figure carries a transcript citation, like [Call 3, Line 41], so any claim traces to the exact line of the exact call.', tags:['Voice agents','AI','Hackathon'], links:[{label:'Open live site', href:'https://negotiator-frontend-iota.vercel.app/'}]},
    {t:'SCNT Studio', s:'Paid client store, WooCommerce', icon:'bottle', b:'A complete WooCommerce storefront for a perfume brand, built end to end in June 2026 as paid client work: product catalog and variants, checkout, a customised responsive theme and on-page SEO.', tags:['WordPress','WooCommerce','SEO','Client work']},
    {t:'Shorts Pipeline', s:'Automated YouTube Shorts', icon:'clapper', b:'Generates and uploads original vertical Shorts end to end: script, narration, word-by-word captions, background, render and YouTube upload. Built around copyright safety: every ingredient is generated or licensed, and each video ships with a manifest of its sources.', tags:['Python','ffmpeg','Claude','YouTube API']},
    {t:'ClinicalHub', s:'Clinic app, React Native', icon:'cross', b:'A clinic-management mobile app built with Expo and React Native. Appointments, chat, prescriptions, documents and finances, backed by Firebase Auth and Realtime Database, with push reminders.', tags:['TypeScript','Expo','React Native','Firebase','NativeWind'], links:[{label:'View code', href:GH + '/ClinicalHub'}]},
    {t:'Daylight', s:'AI daily dashboard', icon:'sun', b:'A minimal AI-powered daily dashboard. Track mood, tasks and finances; get mood suggestions from your notes and task ideas that fit how you feel.', tags:['Next.js','TypeScript','Tailwind','AI'], links:[{label:'Open live site', href:'https://daylight-lime-omega.vercel.app'},{label:'View code', href:GH + '/Daylight'}]},

  phone:  ['.######.','.#....#.','.#....#.','.#....#.','.######.','.##..##.','.######.','........'],
  pin:    ['..####..','.######.','.##..##.','.######.','..####..','...##...','...##...','........'],
  bottle: ['...##...','..####..','...##...','.######.','#......#','#.####.#','#......#','.######.'],
  li:     ['........','.#......','........','.#.###..','.#.#..#.','.#.#..#.','.#.#..#.','........'],
  splat:  ['.##.....','####..#.','.##..###','......#.','..###...','.#####..','..###.##','......##'],
};
const CHIP_TYPES = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

// Generated art for blocks without a screenshot: a Bayer-dithered gradient (random direction)
// with the item's sprite set into cell `at`. Returns a PNG mask (opaque = ink). 24 art px per cell.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function makeArt(icon, w, h, at, scale = 24, span = 1) {
  const P = 3, W = w * scale, H = h * scale, c = document.createElement('canvas');
  c.width = W * P; c.height = H * P;
  const g = c.getContext('2d'), rows = SPRITES[icon];
  const s = Math.floor(scale * span * .7 / 8), size = 8 * s;
  const sx0 = at[0] * scale + (scale * span - size) / 2, sy0 = at[1] * scale + (scale * span - size) / 2;
  const ang = Math.random() * Math.PI * 2, dx = Math.cos(ang), dy = Math.sin(ang);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let on;
    if (x >= sx0 - 3 && x < sx0 + size + 3 && y >= sy0 - 3 && y < sy0 + size + 3) {
      const ix = Math.floor((x - sx0) / s), iy = Math.floor((y - sy0) / s);
      on = ix >= 0 && ix < 8 && iy >= 0 && iy < 8 && rows[iy][ix] === '#';
    } else {
      const t = Math.min(1, Math.max(0, (x / W - .5) * dx + (y / H - .5) * dy + .5));
      on = (.04 + .42 * t) * 16 > BAYER[(y & 3) * 4 + (x & 3)];
    }
    if (on) g.fillRect(x * P, y * P, P, P);
  }
  return c.toDataURL();
}
function setArt(el, uri, iw, ih, ix, iy) {
  for (const [n, v] of Object.entries({ iw, ih, ix, iy })) el.style.setProperty('--' + n, v);
  el.style.setProperty('--img', `url(${uri})`);
  el.dataset.shot = '';
}

const SHAPES = {
  I:[[0,0],[1,0],[2,0],[3,0]], O:[[0,0],[1,0],[0,1],[1,1]], T:[[0,0],[1,0],[2,0],[1,1]],
  S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]],
};
// All distinct rotations per type, cells sorted row-major so cells[0] is the top-left-most cell.
const ORIENTS = {};
for (const [type, base] of Object.entries(SHAPES)) {
  const seen = new Set(); ORIENTS[type] = [];
  let cur = base;
  for (let i = 0; i < 4; i++) {
    cur = cur.map(([x, y]) => [-y, x]);
    const mx = Math.min(...cur.map(p => p[0])), my = Math.min(...cur.map(p => p[1]));
    const n = cur.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    const key = JSON.stringify(n);
    if (!seen.has(key)) { seen.add(key); ORIENTS[type].push(n); }
  }
}

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const board = $('#board'), root = document.documentElement, dlg = $('#detail');
const sleep = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const anim = (el, k, o) => el.animate(k, RM ? { ...o, duration: 1, delay: 0 } : o).finished;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cellPx = () => parseFloat(root.style.getPropertyValue('--cell')) || 64;
const next = () => (current + 1) % PAGES.length;

let current = 0, lines = 0, busy = false, queued = null, state = null;

// Pack a cols x 4 band with tetrominoes, leaving column `well` empty. Randomised backtracking.
function tileBand(cols, well) {
  const H = 4, grid = Array.from({ length: H }, () => Array(cols).fill(false)), pieces = [];
  for (let y = 0; y < H; y++) grid[y][well] = true;
  let steps = 0;
  const solve = () => {
    if (++steps > 4000) return false;
    let fx = -1, fy = -1;
    find: for (let y = 0; y < H; y++) for (let x = 0; x < cols; x++) if (!grid[y][x]) { fx = x; fy = y; break find; }
    if (fy < 0) return true;
    for (const type of shuffle(Object.keys(ORIENTS))) for (const o of shuffle(ORIENTS[type].slice())) {
      const abs = o.map(([x, y]) => [x + fx - o[0][0], y + fy - o[0][1]]);
      if (!abs.every(([x, y]) => y < H && x >= 0 && x < cols && !grid[y][x])) continue;
      abs.forEach(([x, y]) => grid[y][x] = true); pieces.push({ type, abs });
      if (solve()) return true;
      pieces.pop(); abs.forEach(([x, y]) => grid[y][x] = false);
    }
    return false;
  };
  return solve() ? pieces : null;
}

// Order pieces so each falls straight down: anything below it in the same column lands first.
function dropOrder(ps) {
  const below = ps.map(b => ps.map((a, i) => a !== b && a.abs.some(([x, y]) => b.abs.some(([x2, y2]) => x === x2 && y > y2)) ? i : -1).filter(i => i >= 0));
  const done = new Set(), order = [];
  while (order.length < ps.length) {
    const ready = ps.map((_, j) => j).filter(j => !done.has(j) && below[j].every(i => done.has(i)));
    if (!ready.length) return null; // interlocking cycle
    const pick = ready[Math.random() * ready.length | 0];
    done.add(pick); order.push(ps[pick]);
  }
  return order;
}

// Largest rectangle inside a piece, preferring 2+ cells wide, for placing text.
function bestRect(cells) {
  const set = new Set(cells.map(c => c + '')), W = Math.max(...cells.map(c => c[0])) + 1, H = Math.max(...cells.map(c => c[1])) + 1;
  let best = null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) for (let h = 1; y + h <= H; h++) for (let w = 1; x + w <= W; w++) {
    let ok = true;
    for (let yy = y; yy < y + h && ok; yy++) for (let xx = x; xx < x + w; xx++) if (!set.has(xx + ',' + yy)) { ok = false; break; }
    const s = (w >= 2 ? 100 : 0) + w * h * 10 + w;
    if (ok && (!best || s > best.s)) best = { x, y, w, h, s };
  }
  return best;
}

function plan(cols, k, nItems) {
  for (let tries = 0; tries < 300; tries++) {
    const well = Math.random() * cols | 0;
    const bands = [];
    for (let b = 0; b < k; b++) {
      const ps = tileBand(cols, well), order = ps && dropOrder(ps);
      if (!order) break;
      bands.push(order.map(({ type, abs }) => {
        const x0 = Math.min(...abs.map(c => c[0])), y0 = Math.min(...abs.map(c => c[1]));
        const cells = abs.map(([x, y]) => [x - x0, y - y0]);
        return { type, x0, y0, cells, w: Math.max(...cells.map(c => c[0])) + 1, h: Math.max(...cells.map(c => c[1])) + 1, rect: bestRect(cells) };
      }));
    }
    if (bands.length < k) continue;
    const ranked = bands.flat().sort((a, b) => b.rect.s - a.rect.s);
    if (ranked.length < nItems || ranked[nItems - 1].rect.w < 2) continue;
    shuffle(ranked.slice(0, nItems)).forEach((p, i) => p.item = i);
    ranked.slice(nItems).forEach((p, i) => p.extra = i);
    return { bands, well };
  }
  throw new Error('Could not pack blocks');
}

function layout() {
  const vw = root.clientWidth, wide = vw >= 720;
  const cols = wide ? 10 : 6, wCell = Math.floor((Math.min(vw, 1240) - 32) / cols);
  root.style.setProperty('--cols', cols);
  // Fit the board under the intro text so the page needs no scrolling.
  // Two passes, because the title wraps differently at each cell size.
  const fit = k => {
    let cell = wCell;
    for (let i = 0; i < 2; i++) {
      root.style.setProperty('--cell', cell + 'px');
      // Intro height = its text, not its box: the box grows to fill the screen.
      const r = s => $(s).getBoundingClientRect();
      const top = r('.hud').bottom + scrollY + parseFloat(getComputedStyle($('.intro')).paddingTop) + r('#lede').bottom - r('#title').top;
      cell = Math.max(40, Math.min(wCell, Math.floor((innerHeight - top - 60) / (4 * k))));
    }
    return cell;
  };
  // Phones stack two 4-row bands when they fit, otherwise one.
  let k = wide ? 1 : 2, cell = fit(k);
  if (k === 2 && cell < 50) cell = fit(k = 1);
  root.style.setProperty('--cell', cell + 'px');
  root.style.setProperty('--rows', 4 * k);
  return { cols, k };
}

// Fit a label's text strips to its rectangle: the title may wrap to 2 lines, the subtitle gets what's left.
// All item labels sit on art, so the maths follows the strip layout (.piece[data-shot] .label).
function fitLabel(l) {
  const c = cellPx(), pad = c * .1, fs = Math.max(13, c * .19), sub = Math.max(11.5, c * .13) * 1.3;
  const width = +l.dataset.lw * c - 2 * pad - 14, height = +l.dataset.lh * c - 2 * pad - 9;
  const tl = l.querySelector('b').textContent.length * fs * .55 > width ? 2 : 1;
  const meter = l.querySelector('.meter') ? Math.max(5, c * .085) + 6 : 0;
  // 0 means the subtitle doesn't fit at all (small phone cells); it stays readable in the pause menu.
  const n = Math.max(0, Math.floor((height - tl * fs * 1.25 - meter - 4) / sub));
  l.style.setProperty('--tl', tl); l.style.setProperty('--clamp', n);
  l.querySelector('small').hidden = n === 0;
}
const updateClamps = () => board.querySelectorAll('.label:not(.stat-fill)').forEach(fitLabel);

const meterEl = (pct, label) => {
  const m = document.createElement('span');
  m.className = 'meter'; m.setAttribute('role', 'img'); m.setAttribute('aria-label', `${label}, ${pct}%`);
  for (let i = 0; i < 10; i++) m.append(Object.assign(document.createElement('i'), { className: i < Math.round(pct / 10) ? 'on' : '' }));
  return m;
};

function pieceEl(p, rowOff) {
  const item = p.item != null ? PAGES[current].items[p.item] : null;
  const el = document.createElement(item ? 'button' : 'div');
  el.className = 'piece'; el.dataset.type = p.type;
  for (const [n, v] of Object.entries({ c: p.x0, r: rowOff + p.y0, w: p.w, h: p.h })) el.style.setProperty('--' + n, v);
  const own = new Set(p.cells.map(c => c + ''));
  for (const [x, y] of p.cells) {
    const c = document.createElement('span'); c.className = 'cell';
    c.style.setProperty('--x', x); c.style.setProperty('--y', y); c.dataset.col = p.x0 + x;
    for (const [n, dx, dy] of [['et', 0, -1], ['el', -1, 0], ['eb', 0, 1], ['er', 1, 0]]) c.style.setProperty('--' + n, own.has([x + dx, y + dy] + '') ? 0 : 1);
    el.append(c);
  }
  const label = ({ x, y, w, h }) => {
    const l = document.createElement('span');
    for (const [n, v] of Object.entries({ x, y, lw: w, lh: h })) l.style.setProperty('--' + n, v);
    l.className = 'label'; l.dataset.lw = w; l.dataset.lh = h;
    return l;
  };
  const extra = item ? null : PAGES[current].extras?.[p.extra];
  if (item) {
    const b = document.createElement('b'), s = document.createElement('small');
    b.textContent = item.t; s.textContent = item.s;
    const r = { ...p.rect };
    if (item.shot) {
      // Cover-fit the screenshot to the piece's bounding box, in cell units.
      const a = SHOTS[item.shot].a, cover = p.w / p.h > a, iw = cover ? p.w : p.h * a, ih = cover ? p.w / a : p.h;
      setArt(el, SHOTS[item.shot].uri, iw, ih, (p.w - iw) / 2, (p.h - ih) / 2);
    } else {
      // The sprite sits in a cell the text doesn't cover; I pieces give up their last cell, O pieces the top-right one.
      let spare = p.cells.find(([cx, cy]) => cx < r.x || cx >= r.x + r.w || cy < r.y || cy >= r.y + r.h);
      if (!spare) spare = r.w >= 3 ? [r.x + --r.w, r.y] : [p.w - 1, 0];
      setArt(el, makeArt(item.icon, p.w, p.h, spare), p.w, p.h, 0, 0);
    }
    const l = label(r);
    l.append(b);
    if (item.meter) l.append(meterEl(item.meter, item.level));
    l.append(s); el.append(l);
    fitLabel(l);
    el.type = 'button';
    el.onclick = () => openDetail(item);
  } else if (extra) {
    const l = label(p.rect), b = document.createElement('b'), s = document.createElement('small'), vert = p.rect.w === 1;
    l.classList.add('stat-fill'); l.classList.toggle('vert', vert);
    b.textContent = extra.n; s.textContent = extra.l;
    // Number size: up to .42 of a cell, shrunk so it fits along the label's long side.
    l.style.setProperty('--fs', Math.min(.42, (vert ? p.rect.h : p.rect.w) * .8 / (extra.n.length * .62)).toFixed(3));
    l.append(b, s); el.append(l);
    el.setAttribute('aria-hidden', 'true');
  } else el.setAttribute('aria-hidden', 'true');
  return el;
}

function drop(el) {
  const dist = board.getBoundingClientRect().top + el.offsetTop + el.offsetHeight + 16;
  return anim(el, [{ transform: `translateY(${-dist}px)` }, { transform: 'none' }],
    { duration: Math.min(300, 140 + dist * .15), easing: 'cubic-bezier(.55,0,1,.6)' })
    .then(() => el.querySelectorAll('.cell').forEach(c => c.animate([{ filter: 'brightness(1.5)' }, { filter: 'none' }], RM ? 1 : 160)));
}

function updateHud() {
  $('#level').textContent = current + 1;
  $('#lines').textContent = String(lines).padStart(3, '0');
  $('#next-name').textContent = PAGES[next()].name;
  $('#next').setAttribute('aria-label', `Next page: ${PAGES[next()].name}`);
  document.querySelectorAll('#nav button').forEach((b, i) => i === current ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
}

async function renderPage(animate) {
  const page = PAGES[current];
  $('#title').textContent = page.title; $('#lede').textContent = page.lede;
  const { cols, k } = layout(), { bands, well } = plan(cols, k, page.items.length);
  const mine = state = { cols, k, well, bands: [] };
  board.replaceChildren();
  const slot = document.createElement('button'), lab = document.createElement('span');
  slot.className = 'slot'; slot.type = 'button'; slot.style.setProperty('--c', well);
  lab.textContent = 'Next: ' + PAGES[next()].name; slot.append(lab);
  slot.setAttribute('aria-label', `Drop the I piece and go to ${PAGES[next()].name}`);
  slot.onclick = () => go(next());
  board.append(slot);
  document.title = `${page.name} | Ahmed Zuhair`;
  updateHud();
  if (animate) anim($('.intro'), [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'ease-out' });
  // Pieces fall in drop order, each starting 70ms after the last, so the stack builds fast but still reads as a sequence.
  const drops = [];
  for (let b = k - 1; b >= 0; b--) {
    mine.bands[b] = [];
    for (const p of bands[b]) {
      if (state !== mine) return; // a resize re-rendered the page mid-drop
      const el = pieceEl(p, b * 4);
      board.append(el); mine.bands[b].push(el);
      if (animate) { drops.push(drop(el)); await new Promise(r => setTimeout(r, RM ? 0 : 70)); }
    }
  }
  await Promise.all(drops);
}

async function clearBand(els, text) {
  const center = (state.cols - 1) / 2, cells = els.flatMap(el => [...el.querySelectorAll('.cell')]);
  els.forEach(el => el.querySelectorAll('.label').forEach(n => n.remove()));
  await Promise.all(cells.map(c => anim(c, [{ background: '#fff', boxShadow: 'none' }, { background: '#fff', boxShadow: 'none' }], { duration: 170 })));
  const banner = document.createElement('div');
  banner.className = 'banner'; banner.textContent = text; board.append(banner);
  anim(banner, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.08)', offset: .3 }, { opacity: 1, transform: 'scale(1)', offset: .75 }, { opacity: 0, transform: 'scale(1)' }],
    { duration: 800, easing: 'ease-out' }).then(() => banner.remove());
  // Classic NES clear: cells vanish from the centre column outward.
  await Promise.all(cells.map(c => anim(c, [{ transform: 'scale(1)' }, { transform: 'scale(0)' }],
    { duration: 180, delay: Math.abs(c.dataset.col - center) * 40, easing: 'ease-in', fill: 'forwards' })));
  els.forEach(el => el.remove());
}

async function go(target) {
  if (target === current && !busy) return;
  if (busy) { queued = target; return; }
  busy = true;
  if (dlg.open) dlg.close();
  hideTip(false);
  const { k, well } = state;
  // Fill the whole gap first (one I per 4-row band, bottom up), then clear every row in one go.
  const Is = [], falls = [];
  for (let b = k - 1; b >= 0; b--) {
    const I = pieceEl({ type: 'I', x0: well, y0: 0, w: 1, h: 4, cells: [[0, 0], [0, 1], [0, 2], [0, 3]] }, b * 4);
    board.append(I); Is.push(I);
    falls.push(drop(I));
    if (b) await new Promise(r => setTimeout(r, RM ? 0 : 90));
  }
  await Promise.all(falls);
  lines += 4 * k; updateHud();
  await clearBand([...state.bands.flat(), ...Is], k > 1 ? `Tetris ×${k}` : 'Tetris!');
  state.bands = [];
  current = target;
  await renderPage(true);
  busy = false;
  if (queued != null) { const t = queued; queued = null; if (t !== current) go(t); }
}

function openDetail(item) {
  dlg.dataset.type = CHIP_TYPES[Math.random() * 7 | 0]; // a fresh colour every time the menu opens
  $('#d-cat').textContent = `${PAGES[current].name}, level ${current + 1}`;
  const art = $('#d-art'), shot = document.createElement('span');
  const src = item.shot ? SHOTS[item.shot] : { uri: makeArt(item.icon, 3, 2, [.5, 0], 32, 2), a: 1.5 };
  shot.className = 'shot'; shot.style.setProperty('--img', `url(${src.uri})`);
  art.style.setProperty('--a', src.a);
  art.replaceChildren(shot);
  $('#d-title').textContent = item.t; $('#d-sub').textContent = item.s; $('#d-body').textContent = item.b;
  const meter = $('#d-meter');
  meter.replaceChildren(...(item.meter ? [meterEl(item.meter, item.level), `${item.level}, ${item.meter}%`] : []));
  $('#d-tags').replaceChildren(...(item.tags || []).map((t, i) => {
    const li = document.createElement('li'); li.textContent = t; li.dataset.type = CHIP_TYPES[i % 7]; return li;
  }));
  const back = document.createElement('button');
  back.value = 'back'; back.textContent = 'Back to the board';
  $('#d-menu').replaceChildren(...[...(item.links || []).map(({ label, href }) => {
    const a = document.createElement('a'); a.href = href; a.textContent = label;
    if (href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }), back].map(n => { const li = document.createElement('li'); li.append(n); return li; }));
  dlg.showModal();
  dlg.querySelector('.p-menu :is(a,button)').focus();
  // The panel builds in like rows filling: a stepped top-to-bottom reveal.
  anim(dlg, [{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 240, easing: 'steps(6, end)' });
}
dlg.addEventListener('pointerover', e => e.target.closest('.p-menu a, .p-menu button')?.focus({ preventScroll: true }));
// A tap on the dimmed backdrop (outside the panel) closes the menu, as people expect on phones.
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
// Arrow keys move the menu cursor; Enter activates, Esc closes (native).
dlg.addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const items = [...dlg.querySelectorAll('.p-menu a, .p-menu button')];
  const i = items.indexOf(document.activeElement);
  items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
});

PAGES.forEach((p, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = p.name; b.onclick = () => go(i);
  li.append(b); $('#nav').append(li);
});
$('#next').onclick = () => go(next());
addEventListener('keydown', e => {
  if (dlg.open || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); go(next()); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); go((current + PAGES.length - 1) % PAGES.length); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PAGES.length) go(+e.key - 1);
});
// Scrolling (or swiping) past the end of the page drops the I piece. One gesture moves one page:
// trackpad inertia keeps firing wheel events, so a new move needs a fresh gesture (250ms quiet gap).
const atEdge = down => down ? innerHeight + scrollY >= root.scrollHeight - 2 : scrollY <= 0;
const scrollNav = down => {
  if (busy || dlg.open || !atEdge(down)) return;
  hideTip(true);
  go(down ? next() : (current + PAGES.length - 1) % PAGES.length);
};

// Shown once per browser until the visitor scrolls to change page or clicks "Got it".
const tip = $('#tip');
let tipSeen = false;
try { tipSeen = localStorage.getItem('tipSeen') === '1'; } catch {}
function hideTip(remember) {
  if (remember) { tipSeen = true; try { localStorage.setItem('tipSeen', '1'); } catch {} }
  if (tip.hidden) return;
  anim(tip, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(12px)' }], { duration: 200 }).then(() => tip.hidden = true);
}
function showTip() {
  if (tipSeen) return;
  if (matchMedia('(pointer: coarse)').matches) {
    $('#tip-title').textContent = 'Swipe to change page';
    $('#tip-text').textContent = 'Swipe up for the next page, down for the previous one.';
  }
  tip.hidden = false;
  anim(tip, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  setTimeout(() => hideTip(false), 10000);
}
$('#tip-ok').onclick = () => hideTip(true);

let idleTimer;
const wake = () => {
  board.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => board.classList.add('idle'), 8000);
};
for (const t of ['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll']) addEventListener(t, wake, { passive: true });
wake();
let wheelSum = 0, wheelAt = -1e9, armed = true;
addEventListener('wheel', e => {
  if (e.timeStamp - wheelAt > 250) { wheelSum = 0; armed = true; }
  wheelAt = e.timeStamp;
  if (!armed) return;
  wheelSum += e.deltaY;
  if (Math.abs(wheelSum) > 60) { armed = false; scrollNav(wheelSum > 0); }
}, { passive: true });
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => {
  if (touchY == null) return;
  const dy = touchY - e.changedTouches[0].clientY;
  touchY = null;
  if (Math.abs(dy) > 60) scrollNav(dy > 0);
}, { passive: true });
addEventListener('resize', () => {
  if (!state) return;
  const { cols, k } = layout();
  if ((cols !== state.cols || k !== state.k) && !busy) renderPage(false);
  else updateClamps();
});

busy = true; // like go(): input during the first drop is queued, not run mid-animation
// Board size is measured from the intro text, so wait for the web fonts (at most 1.5s) before the first layout.
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(() => renderPage(true)).then(() => {
  busy = false;
  showTip();
  if (queued != null) { const t = queued; queued = null; if (t !== current) go(t); }
});
</script>
</body></html>
